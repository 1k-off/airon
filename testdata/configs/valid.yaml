version: "1"

provider:
  type: openai
  model: gpt-4o
  api_key: ${OPENAI_API_KEY}
  temperature: 0.7

workspace:
  path: ./workspace

runtime:
  max_tool_rounds: 10
  max_call_depth: 3

log:
  level: info

skills:
  - path: ../skills/researcher

agents:
  - id: analyst
    description: "Senior data analyst"
    system_prompt: "You are a data analyst."
    model: gpt-4o-mini
    tools: [fs_read, fs_list]

mcp_servers:
  - name: myserver
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "./workspace"]
    env:
      NODE_ENV: production

prompts:
  - id: research
    system: "You are a researcher."
    content: "Research the given topic."
    tools: [fs_read]
    depends_on: []
  - id: summarize
    content: "Summarize the research findings."
    depends_on: [research]
